name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run ShellCheck
        run: |
          find scripts -type f -name "*.sh" -print0 | xargs -0 shellcheck

  test-backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Test backup.sh
        run: |
          chmod +x scripts/backup.sh
          mkdir -p /tmp/src && echo hello > /tmp/src/file.txt

          # 1. A normal run creates a valid archive
          ./scripts/backup.sh /tmp/src /tmp/backups
          tar -tzf /tmp/backups/backup-*.tar.gz | grep file.txt

          # 2. A missing source folder must fail
          if ./scripts/backup.sh /tmp/nonexistent /tmp/backups; then
            echo "Expected failure for missing source"; exit 1
          fi

          # 3. Retention keeps only the 5 newest archives
          for d in 01 02 03 04 05 06 07; do
            touch /tmp/backups/backup-2026-01-$d.tar.gz
          done
          ./scripts/backup.sh /tmp/src /tmp/backups
          test "$(ls /tmp/backups/backup-*.tar.gz | wc -l)" -eq 5

  deploy:
    needs: [shellcheck, test-backup]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Deploy via SSM
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["cd /home/ec2-user/cloudops-toolkit && sudo -u ec2-user git pull origin main"]' \
            --query "Command.CommandId" --output text)

          aws ssm wait command-executed \
            --command-id "$CMD_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}"

          aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query "StandardOutputContent" --output text
